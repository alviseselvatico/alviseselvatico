[project]
name = "vme"
version = "0.0.1"
description = "Vertical Media Engine — AI-assisted, rights-gated vertical media pipeline (Phase 0)"
readme = "README_IT.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
vme = "vme.cli.main:main"

[dependency-groups]
dev = [
    "mypy>=1.17",
    "pytest>=8.4",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vme"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # isort
    "UP",               # pyupgrade
    "B",                # bugbear
    "S",                # bandit (subprocess/shell safety, secrets)
    "N",                # naming
    "ANN",              # annotations
    "RUF",
    "SIM",
    "PTH",              # pathlib
    "T20",              # no stray print() in library code
    "DTZ",              # timezone-aware datetimes only
]
ignore = [
    "ANN401",           # Any is occasionally needed at JSON boundaries
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607", "ANN", "T20"]
"src/vme/cli/**" = ["T20"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra"
filterwarnings = ["error"]
